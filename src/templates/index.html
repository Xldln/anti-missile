<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Scout — Device Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; color: #1a1a2e;
               min-height: 100vh; padding: 24px;
               background: linear-gradient(180deg,
                   #7f7fd5 0%, #86a8e7 50%, #91eae4 100%);
        }
        .header { display: flex; justify-content: space-between;
                  align-items: center; margin-bottom: 20px;
                  background: rgba(255,255,255,0.25);
                  backdrop-filter: blur(12px); border-radius: 14px;
                  padding: 16px 24px; }
        h1 { font-size: 22px; color: #1a1a2e;
             text-shadow: 0 1px 2px rgba(255,255,255,0.3); }
        .meta { display: flex; gap: 24px; color: rgba(0,0,0,0.6);
                font-size: 13px; margin-bottom: 16px;
                background: rgba(255,255,255,0.25);
                backdrop-filter: blur(8px); border-radius: 10px;
                padding: 10px 16px; flex-wrap: wrap; }
        .meta span strong { color: #1a1a2e; }
        .timer { color: #1a1a2e; font-size: 13px;
                 background: rgba(255,255,255,0.3); border-radius: 8px;
                 padding: 4px 12px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0;
                background: rgba(255,255,255,0.25);
                backdrop-filter: blur(10px); border-radius: 14px;
                overflow: hidden; }
        th { text-align: left; padding: 12px 14px;
             background: rgba(255,255,255,0.3);
             color: rgba(0,0,0,0.55); font-size: 12px;
             text-transform: uppercase; font-weight: 700; }
        td { padding: 12px 14px; border-bottom: 1px solid rgba(0,0,0,0.06);
             font-size: 14px; color: #1a1a2e; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(255,255,255,0.2); }
        .tag { display: inline-block; padding: 3px 10px; border-radius: 20px;
               font-size: 11px; font-weight: 700; }
        .tag-hw { background: rgba(6,95,70,0.15); color: #065f46; }
        .tag-rand { background: rgba(180,40,20,0.15); color: #b42814; }
        .new-badge { background: rgba(91,95,199,0.2); color: #5b5fc7;
                     font-size: 10px; padding: 1px 8px; border-radius: 10px;
                     margin-left: 6px; font-weight: 700; }
        .empty { text-align: center; padding: 48px; color: rgba(0,0,0,0.35); }
        .spinner { display: inline-block; width: 14px; height: 14px;
                   border: 2px solid rgba(0,0,0,0.15);
                   border-top-color: #1a1a2e; border-radius: 50%;
                   animation: spin .6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .target-bar { display: flex; align-items: center; gap: 10px;
                      background: rgba(255,255,255,0.25);
                      backdrop-filter: blur(10px); border-radius: 12px;
                      padding: 12px 18px; margin-bottom: 16px; font-size: 13px; }
        .target-bar label { color: rgba(0,0,0,0.55); white-space: nowrap; }
        .target-bar select { background: rgba(255,255,255,0.4); color: #1a1a2e;
                             border: 1px solid rgba(0,0,0,0.1);
                             padding: 6px 10px; border-radius: 8px; flex: 1;
                             max-width: 280px; }
        .target-bar button { background: rgba(91,95,199,0.25); color: #1a1a2e;
                             border: none; padding: 6px 16px; border-radius: 8px;
                             cursor: pointer; font-weight: 700;
                             transition: background .2s; }
        .target-bar button:hover { background: rgba(91,95,199,0.4); }
        #target-status { color: #1a1a2e; font-weight: 600; }

        .alert-panel {
            background: rgba(220,80,80,0.15); border: 1px solid rgba(180,40,20,0.2);
            backdrop-filter: blur(10px); border-radius: 14px; padding: 16px 20px;
            margin-top: 24px; font-size: 13px;
        }
        .alert-panel h3 { color: #b42814; margin-bottom: 8px; font-size: 14px; }
        .alert-panel ul { padding-left: 20px; }
        .alert-panel li { margin: 4px 0; color: rgba(0,0,0,0.6); }
        .alert-panel code { color: #1a1a2e; background: rgba(255,255,255,0.4);
                           padding: 1px 6px; border-radius: 4px; }
        select option { background: #e8e8f8; color: #1a1a2e; }
    </style>
</head>
<body>

<div class="header">
    <h1>WiFi Scout</h1>
    <span class="timer" id="countdown">refresh in 45s</span>
</div>

<div class="meta" id="meta"></div>

<div class="target-bar" id="target-bar" style="display:none;">
    <label>Alert Target:</label>
    <select id="target-select">
        <option value="">-- select MAC --</option>
    </select>
    <button id="target-set-btn">Set</button>
    <span id="target-status"></span>
</div>

<table id="table-wrap" style="display:none;">
    <thead>
        <tr>
            <th>IP</th>
            <th>MAC</th>
            <th>Type</th>
            <th>Classification</th>
            <th>First Seen</th>
            <th>Duration</th>
            <th>#</th>
        </tr>
    </thead>
    <tbody id="tbody"></tbody>
</table>

<div class="empty" id="empty" style="display:none;">
    <div class="spinner" id="spinner"></div>
    <p id="empty-msg">Scanning...</p>
</div>

<div class="alert-panel" id="alert-info" style="display:none;">
    <h3>Alert Status</h3>
    <ul></ul>
</div>

<script>
const API = '/api/devices';
const INTERVAL = 45;
let countdown = INTERVAL;
let timer = null;

async function fetchDevices() {
    document.getElementById('spinner').style.display = 'inline-block';
    document.getElementById('empty-msg').textContent = 'Scanning network...';
    document.getElementById('empty').style.display = 'block';
    try {
        const res = await fetch(API);
        const data = await res.json();
        render(data);
    } catch (e) {
        document.getElementById('empty-msg').textContent = 'Error: ' + e.message;
    }
    document.getElementById('empty').style.display = 'none';
}

function render(data) {
    // Meta
    const meta = document.getElementById('meta');
    meta.innerHTML = `
        <span>Network: <strong>${data.network}</strong></span>
        <span>Router: <strong>${data.router || 'unknown'}</strong></span>
        <span>WiFi Stations: <strong>${data.wifi_stations ?? '-'}</strong></span>
        <span>Devices: <strong>${data.device_count}</strong></span>
        <span>Scan: <strong>${new Date(data.timestamp).toLocaleTimeString()}</strong></span>
    `;

    // Target bar
    document.getElementById('target-bar').style.display = 'flex';
    const select = document.getElementById('target-select');
    select.innerHTML = '<option value="">-- select MAC --</option>' +
        data.devices.map(d =>
            `<option value="${d.mac}">${d.mac} — ${d.ip} — ${d.classification}</option>`
        ).join('');
    if (data.target_mac) {
        select.value = data.target_mac;
    }

    document.getElementById('target-set-btn').onclick = async () => {
        const mac = select.value;
        const status = document.getElementById('target-status');
        const res = await fetch('/api/target', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mac }),
        });
        const result = await res.json();
        if (result.status === 'ok') {
            status.textContent = mac ? 'Tracking: ' + mac : 'Tracking disabled';
            status.style.color = '#4ade80';
        }
    };

    // Table
    const tbody = document.getElementById('tbody');
    if (data.devices.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">No devices found</td></tr>';
        document.getElementById('table-wrap').style.display = 'table';
        return;
    }
    tbody.innerHTML = data.devices.map(d => {
        const cls = d.classification.includes('[randomized]') ? 'tag-rand' : 'tag-hw';
        const isNew = d.seen_count === 1;
        const dur = d.duration_seconds != null
            ? formatDuration(d.duration_seconds) : '-';
        return `<tr>
            <td>${d.ip}</td>
            <td>${d.mac}${isNew ? '<span class="new-badge">NEW</span>' : ''}</td>
            <td>${d.type}</td>
            <td><span class="tag ${cls}">${d.classification}</span></td>
            <td>${d.first_seen ? new Date(d.first_seen).toLocaleTimeString() : '-'}</td>
            <td>${dur}</td>
            <td>${d.seen_count}</td>
        </tr>`;
    }).join('');
    document.getElementById('table-wrap').style.display = 'table';

    // Alert info
    const alertDiv = document.getElementById('alert-info');
    if (data.wifi_stations && data.device_count < data.wifi_stations) {
        const hidden = data.wifi_stations - data.device_count;
        alertDiv.style.display = 'block';
        alertDiv.querySelector('ul').innerHTML = `
            <li>BSS reports <strong>${data.wifi_stations}</strong> connected
                stations, but ARP only sees <strong>${data.device_count}</strong></li>
            <li>Router may have <strong>AP isolation</strong> enabled —
                ${hidden} device(s) hidden</li>
            <li>Check router admin panel for full device list</li>
        `;
    } else {
        alertDiv.style.display = 'none';
    }
}

function formatDuration(sec) {
    if (sec < 60) return Math.round(sec) + 's';
    if (sec < 3600) return Math.floor(sec / 60) + 'm ' + Math.round(sec % 60) + 's';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    return h + 'h ' + m + 'm';
}

function startTimer() {
    countdown = INTERVAL;
    document.getElementById('countdown').textContent = `refresh in ${countdown}s`;
    timer = setInterval(() => {
        countdown--;
        document.getElementById('countdown').textContent = `refresh in ${countdown}s`;
        if (countdown <= 0) {
            fetchDevices();
            countdown = INTERVAL;
        }
    }, 1000);
}

fetchDevices();
startTimer();
</script>
</body>
</html>
